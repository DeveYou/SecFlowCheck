# .gitlab-ci.yml
stages:
  - test
  - security
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Cache dependencies between jobs
cache:
  paths:
    - .cache/pip
    - .venv/
  key: "$CI_COMMIT_REF_SLUG"

before_script:
  - python --version
  - pip --version
  - pip install virtualenv

.test-template: &test-template
  stage: test
  before_script:
    - python -m venv .venv
    - source .venv/Scriptactivate  # Windows
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov black flake8 mypy

# Test jobs
test:python:
  <<: *test-template
  script:
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
  artifacts:
    paths:
      - htmlcov/
    reports:
      cobertura: coverage.xml

test:linting:
  <<: *test-template
  script:
    - black --check app/ tests/
    - flake8 app/ tests/ --max-line-length=88 --extend-ignore=E203
    - mypy app/ --ignore-missing-imports

test:type-checking:
  <<: *test-template
  script:
    - mypy app/ --strict --ignore-missing-imports

# Security scanning
security:sast:
  stage: security
  image: 
    name: python:$PYTHON_VERSION
  before_script:
    - pip install bandit safety
  script:
    - bandit -r app/ -f json -o bandit-report.json
    - safety check --json --output safety-report.json
  artifacts:
    reports:
      sast: bandit-report.json
  allow_failure: true

security:dependency-check:
  stage: security
  script:
    - pip install safety
    - safety check --full-report
  allow_failure: true

# Build stage
build:docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache docker-compose
  script:
    - docker build -t secflowcheck-parser:latest .
    - docker tag secflowcheck-parser:latest $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - develop
  dependencies: []

# Deploy to test environment
deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to staging environment"
    - curl -X POST $STAGING_DEPLOY_WEBHOOK
  environment:
    name: staging
    url: https://staging-secflowcheck.example.com
  only:
    - develop
  when: manual

# Deploy to production
deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to production environment"
    - curl -X POST $PRODUCTION_DEPLOY_WEBHOOK
  environment:
    name: production
    url: https://secflowcheck.example.com
  only:
    - main
  when: manual

# Pipeline configuration
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\/.*$/
      when: manual

# Include GitLab's built-in SAST template (optional)
include:
  - template: Security/SAST.gitlab-ci.yml