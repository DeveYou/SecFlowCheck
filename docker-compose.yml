version: "3.8"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"

  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "${MONGO_PORT}:27017"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_DASHBOARD_PORT}:15672"

  discovery:
    build: ./secflowcheck-discovery
    ports:
      - "${DISCOVERY_PORT}:8761"

  gateway:
    build: ./secflowcheck-gateway
    depends_on:
      - discovery
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery:8761/eureka/"
    ports:
      - "${GATEWAY_PORT}:8080"

  auth:
    build: ./secflowcheck-authentication
    depends_on:
      - discovery
      - postgres
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      EUREKA_SERVER: "http://discovery:8761/eureka"
    ports:
      - "${AUTH_PORT}:8000"

  parser:
    build: ./secflowcheck-parser
    depends_on:
      - mongo
      - discovery
    environment:
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_SERVER: "http://discovery:8761/eureka"
    ports:
      - "${PARSER_PORT}:8000"

  analyzer:
    build: ./secflowcheck-analyzer
    depends_on:
      - rabbitmq
      - discovery
    environment:
      CELERY_BROKER: "amqp://guest:guest@rabbitmq:5672//"
      REPORT_API_URL: "http://report:8002/reports"
      REPORT_JWT: ${REPORT_JWT}
    ports:
      - "${ANALYZER_PORT}:8000"

  analyzer-worker:
    build: ./secflowcheck-analyzer
    command: celery -A celeryconfig.celery_app worker --loglevel=info -Q analysis_queue
    depends_on:
      - rabbitmq
      - analyzer

  report:
    build: ./secflowcheck-report
    depends_on:
      - mongo
      - discovery
      - analyzer
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: ${MONGO_DB}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${REPORT_PORT}:8002"

volumes:
  mongo-data:
  postgres-data:
